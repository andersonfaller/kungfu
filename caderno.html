<title>Caderno Shaolin do Norte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: caderno de treino. Cabeçalho com selo, abas fixas, uma coluna no celular e duas no desktop.
   As cores das faixas de dragão marcam as fases; o selo vermelho marca o que já foi aprendido. */
:root{
  --paper:#EDF0EC; --surface:#FAFBF8; --sunken:#E2E7E2; --ink:#17201B; --muted:#55625B; --line:#CBD4CD;
  --jade:#1B6853; --jade-ink:#FFFFFF; --jade-soft:#D3E6DD;
  --seal:#B3362A; --seal-ink:#FFF5F0; --seal-soft:#F2DAD4;
  --amber:#9C6A0C; --amber-soft:#F3E4C2;
  --heat0:#DCE2DD;
  --shadow:0 1px 2px rgba(20,32,26,.06),0 8px 22px rgba(20,32,26,.07);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-han:"LXGW WenKai TC","Noto Serif TC","Kaiti TC","STKaiti","PMingLiU",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1412; --surface:#161D1A; --sunken:#0B0F0D; --ink:#E3EAE5; --muted:#96A39C; --line:#29332F;
    --jade:#57B796; --jade-ink:#05140E; --jade-soft:#17322A;
    --seal:#C9493B; --seal-ink:#FFF3EE; --seal-soft:#3A1B16;
    --amber:#E0A53A; --amber-soft:#382B12;
    --heat0:#1E2723;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1412; --surface:#161D1A; --sunken:#0B0F0D; --ink:#E3EAE5; --muted:#96A39C; --line:#29332F;
  --jade:#57B796; --jade-ink:#05140E; --jade-soft:#17322A;
  --seal:#C9493B; --seal-ink:#FFF3EE; --seal-soft:#3A1B16;
  --amber:#E0A53A; --amber-soft:#382B12;
  --heat0:#1E2723;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:6px}
.han{font-family:var(--f-han)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* Cabeçalho */
.top{padding-block:22px 10px}
.brand{display:flex;align-items:center;gap:14px}
.seal{display:inline-grid;place-items:center;background:var(--seal);color:var(--seal-ink);font-family:var(--f-han);font-weight:700;border-radius:4px;line-height:1;flex:none}
.seal.lg{width:52px;height:52px;font-size:1.25rem;writing-mode:vertical-rl;letter-spacing:.06em;transform:rotate(-3deg);box-shadow:inset 0 0 0 2px var(--seal),inset 0 0 0 3.5px var(--seal-ink)}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,4.6vw,2.4rem);line-height:1;letter-spacing:.01em;text-transform:uppercase}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.9rem}

/* Abas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:1.02rem;letter-spacing:.04em;text-transform:uppercase;padding:12px 10px 10px;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--jade)}
.tabs a:hover{color:var(--ink)}

main{padding-block:18px 64px}
.view{display:grid;gap:16px}
.banner{border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;color:var(--muted);font-size:.92rem;background:var(--surface)}
.banner[data-tone="warn"]{border-style:solid;border-color:var(--amber);color:var(--ink);background:var(--amber-soft)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:.02em;text-transform:uppercase}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:860px){.grid2{grid-template-columns:1fr 1fr}}
.grid2>*{min-width:0}

/* Herói: fase atual */
.hero{box-shadow:var(--shadow);display:grid;gap:18px}
.hero-top{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.hero .fase{font-family:var(--f-display);font-weight:700;font-size:clamp(3rem,10vw,4.6rem);line-height:.85;text-transform:uppercase}
.hero .fase small{font-size:.42em;letter-spacing:.06em;color:var(--muted);display:block;margin-top:8px;line-height:1.1}
.hero .pct{text-align:right}
.hero .pct b{font-family:var(--f-display);font-size:2.4rem;line-height:1}
.strip{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.seg{position:relative;height:46px;border-radius:6px;background:var(--sunken);overflow:hidden;border:1px solid var(--line)}
.seg .sw{position:absolute;left:0;right:0;top:0;height:9px;background:var(--sw);border-bottom:1px solid var(--line)}
.seg .sw.none{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px)}
.seg .fill{position:absolute;left:0;bottom:0;top:9px;background:var(--jade-soft)}
.seg b{position:absolute;inset:9px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-size:1.05rem;font-weight:700;color:var(--muted)}
.seg.cur{border-color:var(--jade);box-shadow:0 0 0 1px var(--jade)}
.seg.cur b{color:var(--ink)}
.seg.done .fill{background:var(--seal-soft)}
.seg.done b{color:var(--seal)}
.strip-legend{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

.meters{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.meters{grid-template-columns:repeat(3,minmax(0,1fr))}}
.meter{display:grid;gap:8px;align-content:start}
.meter .val{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1}
.meter .val span{font-size:1rem;color:var(--muted);font-weight:600}
.ticks{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:3px}
.ticks i{height:14px;border-radius:3px;background:var(--sunken);border:1px solid var(--line)}
.ticks i.ok{background:var(--seal);border-color:var(--seal)}
.ticks i.wip{background:var(--amber-soft);border-color:var(--amber)}
.bar{height:10px;border-radius:99px;background:var(--sunken);overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--seal)}

/* Listas de itens */
.list{display:grid;gap:0;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;cursor:pointer}
.list li:first-child .row{border-top:0}
.row:hover .row-name{color:var(--jade)}
.row-name{font-weight:700;display:block}
.row-sub{display:block;color:var(--muted);font-size:.86rem}
.row-sub .han{color:var(--ink);font-size:1rem;margin-right:6px}
.kind{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.75rem;color:var(--muted);margin-right:6px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip[data-s="aprendendo"]{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}
.chip[data-s="aprendido"]{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.chip .han{font-weight:700}

.empty{color:var(--muted);font-size:.92rem;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--jade);background:var(--jade);color:var(--jade-ink);font-weight:700;padding:9px 14px;cursor:pointer;text-decoration:none;font-size:.95rem}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--jade)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.85rem}

/* Sequência (fases) */
details.fase{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.fase[open]{box-shadow:var(--shadow)}
details.fase>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px}
details.fase>summary::-webkit-details-marker{display:none}
.sash{width:14px;height:44px;border-radius:3px;background:var(--sw);border:1px solid var(--line)}
.sash.none{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px)}
.fase-title{font-family:var(--f-display);font-weight:700;font-size:1.35rem;text-transform:uppercase;line-height:1.05}
.fase-title .han{font-size:1.05rem;margin-left:6px;text-transform:none;font-weight:400}
.fase-meta{color:var(--muted);font-size:.85rem}
.fase-pct{font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.fase-body{padding:0 16px 14px}
.uniforme{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.uniforme::before,.uniforme::after{content:"";flex:1;height:1px;background:var(--line)}
.golpes-row{display:flex;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.golpes-row a{color:var(--ink)}

/* Socos e chutes */
.gtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gtools label{font-size:.9rem;color:var(--muted)}
.gtools input{width:5.5rem}
.input,.gtools input,select.input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;min-width:0}
textarea.input{width:100%;resize:vertical;min-height:4.8rem;line-height:1.45}
.gfase{display:grid;gap:8px;padding-top:12px}
.gfase+.gfase{border-top:1px solid var(--line);margin-top:12px}
.gfase h3{font-family:var(--f-display);font-weight:600;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.tile{position:relative;display:grid;align-content:start;gap:2px;min-height:74px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);text-align:left;cursor:pointer}
.tile b{font-family:var(--f-display);font-size:1.6rem;line-height:1;font-weight:700;color:var(--muted)}
.tile span{font-size:.72rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
.tile[data-s="aprendido"]{background:var(--seal-soft);border-color:var(--seal)}
.tile[data-s="aprendido"] b{color:var(--seal)}
.tile[data-s="aprendido"] span{color:var(--ink)}
.tile[data-s="aprendendo"]{background:var(--amber-soft);border-color:var(--amber)}
.tile[data-s="aprendendo"] b{color:var(--ink)}
.tile .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--jade)}
.tile:hover{border-color:var(--jade)}

/* Treinos */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1;font-weight:700}
.stat span{font-size:.82rem;color:var(--muted)}
.heat-wrap{overflow-x:auto;padding-bottom:4px}
.heat{display:inline-grid;grid-auto-flow:column;gap:3px}
.hcol{display:grid;grid-template-rows:repeat(7,12px);gap:3px}
.hcol i{width:12px;height:12px;border-radius:2px;background:var(--heat0)}
.hcol i.h1{background:color-mix(in srgb,var(--jade) 40%,var(--heat0))}
.hcol i.h2{background:color-mix(in srgb,var(--jade) 70%,var(--heat0))}
.hcol i.h3{background:var(--jade)}
.hcol i.fut{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.hmonths{display:grid;grid-auto-flow:column;grid-auto-columns:12px;gap:3px;font-size:.7rem;color:var(--muted);height:16px;white-space:nowrap}
.form{display:grid;gap:12px}
.form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.field{display:grid;gap:4px;min-width:0}
.field>label,.legend{font-size:.85rem;font-weight:700;color:var(--muted)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.check{position:relative}
.check input{position:absolute;opacity:0;inset:0;cursor:pointer}
.check span{display:inline-block;padding:5px 11px;border-radius:99px;border:1px solid var(--line);font-size:.86rem;background:var(--paper)}
.check input:checked+span{background:var(--jade-soft);border-color:var(--jade);color:var(--ink);font-weight:700}
.check input:focus-visible+span{outline:2px solid var(--jade);outline-offset:2px}
.tlist{display:grid;gap:0}
.tmonth{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:.9rem;padding:14px 0 4px}
.tr{display:grid;grid-template-columns:4.2rem minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.tr .d{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1}
.tr .d small{display:block;font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.tr p{margin:4px 0 0;font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tags span{font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted)}
.tr-actions{display:flex;flex-direction:column;gap:6px}
.tr.editing{background:var(--jade-soft);margin-inline:-8px;padding-inline:8px;border-radius:8px}
#t-form{scroll-margin-top:64px}

/* Referência */
.prose{max-width:68ch}
.prose p{margin:.5em 0}
.prose a:not(.btn),.card a:not(.btn){color:var(--jade)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;color:var(--muted)}
td .han{font-size:1.15rem}
.lineage{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.92rem}
.lineage span{border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:var(--paper)}
.lineage i{color:var(--muted);font-style:normal}
.glossary{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.gl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.gl .han{font-size:1.6rem;grid-row:span 2}
.gl b{font-size:.95rem}
.gl span{font-size:.85rem;color:var(--muted)}

/* Painel lateral (ficha do item) */
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.45);z-index:20}
.sheet{position:fixed;z-index:21;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25);
  left:0;right:0;bottom:0;max-height:94%;height:94%;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:860px){.sheet{left:auto;top:0;right:0;bottom:0;height:auto;max-height:none;width:560px;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}}
.sheet-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1;text-transform:uppercase;margin-top:4px}
.sheet-head .trad{margin-top:6px;color:var(--muted);font-size:.92rem}
.sheet-head .trad .han{font-size:1.5rem;color:var(--ink);margin-right:8px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:1.2rem;line-height:1}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 28px;display:grid;gap:18px;align-content:start;-webkit-overflow-scrolling:touch}
.sheet-foot{border-top:1px solid var(--line);padding:10px 20px;font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.seg-ctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg-ctl label{position:relative;text-align:center;padding:10px 6px;font-weight:700;font-size:.92rem;cursor:pointer;border-left:1px solid var(--line)}
.seg-ctl label:first-child{border-left:0}
.seg-ctl input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg-ctl label:has(input:checked){background:var(--jade-soft);color:var(--ink)}
.seg-ctl label[data-s="aprendendo"]:has(input:checked){background:var(--amber-soft)}
.seg-ctl label[data-s="aprendido"]:has(input:checked){background:var(--seal);color:var(--seal-ink)}
.seg-ctl label:has(input:focus-visible){outline:2px solid var(--jade);outline-offset:-3px}
.linhas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.linhas .check span{display:block;text-align:center;border-radius:8px;padding:8px 0;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.linhas .check input:checked+span{background:var(--seal);border-color:var(--seal);color:var(--seal-ink)}
.ref{border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:.92rem;color:var(--muted)}
.ref b{color:var(--ink)}
.ask{border:1px solid var(--jade);background:var(--jade-soft);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.ask h3,.notes h3{font-family:var(--f-display);font-weight:700;font-size:1.1rem;text-transform:uppercase;letter-spacing:.03em}
.ask textarea{background:var(--surface)}
.draft{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;display:grid;gap:8px;font-size:.92rem}
.draft h4{margin:0;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.draft ol,.draft ul{margin:0;padding-left:1.3em}
.notes{display:grid;gap:14px}
.hint{font-size:.8rem;color:var(--muted);font-weight:400}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-size:.92rem;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @media (min-width:860px){.sheet{animation:slide .22s ease-out}}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

/* ---------- Grade da ASKF (fonte: kungfusantos.com.br/graduacao-kung-fu-shaolin-do-norte) ---------- */

  {n:8, titulo:"Dragão Verde", han:"绿龙", cor:"#2E8B4F", aviso:true, golpes:[56,60], formas:[
    {id:"shaolin-9", tipo:"maos", nome:"9º Shǎo Lín", han:"開門", py:"Kāi Mén", ca:"Hoi Mun", pt:"Abrir a porta", orig:1},
    {id:"espada-dupla", tipo:"arma", nome:"Espada Dupla Shǎo Lín"},
    {id:"liuhe-1", tipo:"maos", nome:"1º Liù Hé Quán", han:"六合拳", py:"Liù Hé Quán", pt:"Punho das seis harmonias"},
    {id:"leque-clf", tipo:"arma", nome:"Leque Cài Lǐ Fó Hóng Shèng"},
    {id:"garra-aguia-kaoshen-1", tipo:"maos", nome:"1º Garra de Águia Kào Shēn"},
    {id:"combinado-espada", tipo:"dupla", nome:"Combinado Espada"},
  ]},
  {n:9, titulo:"Dragão Prateado", han:"银龙", cor:"#A7AFB6", golpes:[61,65], formas:[
    {id:"shaolin-10", tipo:"maos", nome:"10º Shǎo Lín", han:"連環", py:"Lián Huán", ca:"Lin Waan", pt:"Ataque encadeado", orig:9},
    {id:"lanca-24", tipo:"arma", nome:"Lança 24 movimentos"},
    {id:"bagua-1", tipo:"maos", nome:"1º Bā Guà Zhǎng", han:"八卦掌", py:"Bā Guà Zhǎng", pt:"Palma dos oito trigramas"},
    {id:"vassoura", tipo:"arma", nome:"Vassoura Shǎo Lín"},
    {id:"louva-3", tipo:"maos", nome:"3º Louva-a-Deus", han:"螳螂拳", py:"Táng Láng Quán"},
  ]},
  {n:10, titulo:"Dragão Branco", han:"白龙", cor:"#F4F4F2", golpes:null, formas:[
    {id:"shaolin-11", tipo:"maos", nome:"11º Shǎo Lín", han:"式法", py:"Shì Fǎ", ca:"Sik Faat", pt:"Técnica habilidosa", orig:10},
    {id:"escudo-facao", tipo:"arma", nome:"Escudo com facão"},
    {id:"xingyi-1", tipo:"maos", nome:"1º Xíng Yì", han:"形意拳", py:"Xíng Yì Quán", pt:"Punho da forma e da intenção"},
    {id:"agulha", tipo:"arma", nome:"Agulha"},
    {id:"combinado-lanca-gundao", tipo:"dupla", nome:"Combinado Lança x Gùn Dāo"},
  ]},
  {n:11, titulo:"Dragão Branco", han:"白龙", cor:"#F4F4F2", uniforme:"Roupa preta", golpes:null, formas:[
    {id:"tecnicas-especiais", tipo:"especial", nome:"Técnicas Especiais"},
  ]},
];
const TIPOS = {maos:"Mãos livres", arma:"Arma", dupla:"Em dupla", especial:"Técnicas", soco:"Soco", chute:"Chute"};
const STATUS = {novo:"A aprender", aprendendo:"Aprendendo", aprendido:"Aprendido"};
const AULAS = [
  {id:"tradicional", nome:"Kung Fu Tradicional"}, {id:"kati", nome:"Kati"}, {id:"combate", nome:"Combate"},
  {id:"acrobacia", nome:"Acrobacia"}, {id:"forca", nome:"Força"}, {id:"chikung", nome:"Chi Kung"}, {id:"livre", nome:"Treino livre"},
];
const CAMPOS = [
  {k:"resumo", t:"O que é", h:"Uma ou duas frases sobre a técnica ou o kati."},
  {k:"movimentos", t:"Sequência de movimentos", h:"Um movimento por linha, na ordem."},
  {k:"pontos", t:"Pontos-chave", h:"Base, alinhamento, respiração, ritmo."},
  {k:"erros", t:"Erros comuns e correções", h:"O que o professor costuma corrigir."},
  {k:"aplicacoes", t:"Aplicações", h:"Para que serve cada trecho numa luta."},
  {k:"observacoes", t:"Observações", h:"Dúvidas, lembretes, histórico."},
  {k:"links", t:"Vídeos e referências", h:"Um link por linha."},
];

const ITENS = {};
const ORDEM = [];
for (const f of FASES) {
  for (const it of f.formas) { ITENS[it.id] = {...it, fase:f.n}; ORDEM.push(it.id); }
  if (f.golpes) for (let i=f.golpes[0]; i<=f.golpes[1]; i++) {
    ITENS["soco-"+i] = {id:"soco-"+i, tipo:"soco", num:i, fase:f.n, nome:i+"º soco"};
    ITENS["chute-"+i] = {id:"chute-"+i, tipo:"chute", num:i, fase:f.n, nome:i+"º chute"};
  }
}
const MAXG = 65;

/* ---------- Estado ---------- */
const S = {
  itens:{}, treinos:[], config:{metaSemanal:3},
  db:null, sample:null, downloads:null, canWrite:true,
  loaded:false, dbState:"loading", view:"painel", sheetId:null,
  openFases:new Set(), dirty:{}, foco:new Set(),
};

/* ---------- Utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const range = (a,b) => Array.from({length:b-a+1}, (_,i)=>a+i);
const pad = n => String(n).padStart(2,"0");
const isoD = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); };
const hoje = () => isoD(new Date());
const monday = dt => { const d = new Date(dt); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d; };
const weekKey = s => isoD(monday(parseD(s)));
const MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESL = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIA = ["dom","seg","ter","qua","qui","sex","sáb"];
const fmtData = s => { if(!s) return ""; const d = parseD(s); return d.getDate()+" "+MES[d.getMonth()]+" "+d.getFullYear(); };
const fmtMin = m => { m = Number(m)||0; const h = Math.floor(m/60), r = m%60; return h ? (h+"h"+(r?pad(r):"")) : (r+" min"); };
const lines = s => String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);

function rec(id){ return S.itens[id] || {}; }
function st(id){ return rec(id).status || "novo"; }
function prog(id){
  const it = ITENS[id], r = rec(id);
  if (r.status === "aprendido") return 1;
  if (it && it.linhas) return Math.min((r.linhas||[]).length / it.linhas, .99);
  return 0;
}
function chip(s){ return `<span class="chip" data-s="${s}">${s==="aprendido"?'<span class="han" aria-hidden="true">會</span>':""}${STATUS[s]}</span>`; }
function itemLabel(id){
  const it = ITENS[id]; if (!it) return id;
  if (it.tipo==="soco"||it.tipo==="chute") { const n = rec(id).nome; return it.nome + (n ? " · "+n : ""); }
  return it.nome;
}
function faseStats(f){
  const formas = f.formas.map(i=>i.id);
  const fp = formas.reduce((a,id)=>a+prog(id),0);
  const fl = formas.filter(id=>st(id)==="aprendido").length;
  let socos=null, chutes=null;
  if (f.golpes) {
    const ids = range(f.golpes[0], f.golpes[1]);
    socos = {feito: ids.filter(i=>st("soco-"+i)==="aprendido").length, total: ids.length};
    chutes = {feito: ids.filter(i=>st("chute-"+i)==="aprendido").length, total: ids.length};
  }
  const total = formas.length + (socos ? socos.total + chutes.total : 0);
  const done = fp + (socos ? socos.feito + chutes.feito : 0);
  return {fp, fl, ft:formas.length, socos, chutes, pct: total ? done/total : 0};
}
function faseAtual(){ return FASES.find(f => faseStats(f).pct < 1) || FASES[FASES.length-1]; }
function totalPct(){
  let t=0, d=0;
  for (const id in ITENS) { t++; d += prog(id); }
  return d/t;
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 3200);
}
function banner(msg, tone){
  const b = $("#banner");
  if (!msg) { b.hidden = true; return; }
  b.textContent = msg; b.dataset.tone = tone || ""; b.hidden = false;
}

/* ---------- Gravação ---------- */
const chains = {};
function onWriteError(e){
  const code = e && e.code;
  if (code === "invalid_argument") { S.canWrite = false; applyReadOnly(); toast("Este caderno está só para leitura para você."); }
  else if (code === "quota_exceeded") toast("O espaço do caderno acabou. Exporte e apague registros antigos de treino.");
  else toast("Não consegui salvar agora. Tente de novo em instantes.");
  setSaveState("erro");
}
function writeDoc(path, data, kind){
  if (!S.db) { toast("Abra este caderno no Claude, conectado, para salvar."); return Promise.resolve(); }
  const key = path;
  const run = async () => {
    const ref = S.db.doc(path);
    try { kind==="delete" ? await ref.delete() : await ref.set(data); }
    catch (e) {
      if (e && e.code === "unavailable") {
        await new Promise(r=>setTimeout(r, 600 + Math.random()*900));
        kind==="delete" ? await ref.delete() : await ref.set(data);
      } else throw e;
    }
  };
  chains[key] = (chains[key] || Promise.resolve()).then(run).catch(e => { onWriteError(e); });
  return chains[key];
}
function saveItem(id, patch){
  if (!S.canWrite) return Promise.resolve();
  const cur = {...rec(id), ...patch, atualizado: new Date().toISOString()};
  S.itens[id] = cur;
  setSaveState("salvando");
  renderViews();
  return writeDoc("itens/"+id, cur).then(()=> setSaveState("salvo"));
}

/* ---------- Painel ---------- */
function renderPainel(){
  const f = faseAtual(), fs = faseStats(f);
  const strip = FASES.map(x => {
    const p = faseStats(x).pct;
    return `<div class="seg${x.n===f.n?" cur":""}${p>=1?" done":""}" title="${x.n}ª fase · ${esc(x.titulo)} · ${Math.round(p*100)}%">
      <span class="sw${x.cor?"":" none"}" style="--sw:${x.cor||"transparent"}"></span>
      <span class="fill" style="width:${(p*100).toFixed(1)}%"></span><b>${x.n}</b></div>`;
  }).join("");
  const ticks = (tipo) => f.golpes ? range(f.golpes[0], f.golpes[1]).map(i => {
    const s = st(tipo+"-"+i); return `<i class="${s==="aprendido"?"ok":s==="aprendendo"?"wip":""}" title="${i}º ${tipo}"></i>`;
  }).join("") : "";
  const formasList = f.formas.map(it => `<li><button class="row" data-open="${it.id}">
      <span><span class="row-name">${esc(it.nome)}</span>
      <span class="row-sub">${it.han?`<span class="han">${it.han}</span>`:""}${esc(TIPOS[it.tipo])}${it.linhas?` · ${(rec(it.id).linhas||[]).length} de ${it.linhas} linhas`:""}</span></span>
      ${chip(st(it.id))}</button></li>`).join("");

  const wip = Object.keys(ITENS).filter(id => st(id)==="aprendendo");
  const next = [];
  for (const it of f.formas) if (st(it.id)==="novo") { next.push(it.id); break; }
  for (const tipo of ["soco","chute"]) {
    for (let i=1; i<=MAXG; i++) { if (st(tipo+"-"+i)==="novo") { next.push(tipo+"-"+i); break; } }
  }
  const nextRows = [...new Set([...wip, ...next])].map(id => {
    const it = ITENS[id], r = rec(id);
    const extra = it.linhas ? ` · ${(r.linhas||[]).length} de ${it.linhas} linhas` : "";
    return `<li><button class="row" data-open="${id}"><span><span class="row-name">${esc(itemLabel(id))}</span>
      <span class="row-sub">${it.fase}ª fase · ${esc(TIPOS[it.tipo])}${extra}</span></span>${chip(st(id))}</button></li>`;
  }).join("");

  const conquistas = Object.keys(S.itens).filter(id => ITENS[id] && st(id)==="aprendido" && rec(id).conclusao)
    .sort((a,b) => String(rec(b).conclusao).localeCompare(String(rec(a).conclusao))).slice(0,6);
  const conqRows = conquistas.map(id => `<li><button class="row" data-open="${id}"><span><span class="row-name">${esc(itemLabel(id))}</span>
      <span class="row-sub">${fmtData(rec(id).conclusao)}</span></span>${chip("aprendido")}</button></li>`).join("");

  const t = statsTreinos();
  $("#v-painel").innerHTML = `
    <div class="card hero">
      <div class="hero-top">
        <div><div class="eyebrow">Fase atual</div>
          <div class="fase">${f.n}ª fase<small>${esc(f.titulo)} ${f.han?`<span class="han">${f.han}</span>`:""}${f.n<=5?" · roupa preta":f.n<=10?" · roupa vermelha":" · roupa preta"}</small></div></div>
        <div class="pct"><div class="eyebrow">Desta fase</div><b class="num">${Math.round(fs.pct*100)}%</b>
          <div class="muted small num">${Math.round(totalPct()*100)}% da grade inteira</div></div>
      </div>
      <div style="display:grid;gap:6px">
        <div class="strip" aria-label="As 11 fases da graduação">${strip}</div>
        <div class="strip-legend"><span>Iniciante</span><span>Faixas de dragão: marrom → branco</span><span>11ª</span></div>
      </div>
      <div class="meters">
        <div class="meter"><div class="eyebrow">Katis da fase</div>
          <div class="val num">${fs.fl}<span> de ${fs.ft}</span></div>

/* ---------- Treinos ---------- */
function statsTreinos(){
  const byDay = {}, byWeek = {};
  for (const t of S.treinos) {
    if (!t.data) continue;
    byDay[t.data] = (byDay[t.data]||0) + (Number(t.minutos)||0 || 1);
    const wk = weekKey(t.data); byWeek[wk] = (byWeek[wk]||0) + 1;
  }
  const meta = Math.max(1, Number(S.config.metaSemanal)||3);
  const semana = byWeek[isoD(monday(new Date()))] || 0;
  const ym = hoje().slice(0,7);
  const mesL = S.treinos.filter(t => String(t.data||"").slice(0,7) === ym);
  const minMes = mesL.reduce((a,t)=>a+(Number(t.minutos)||0),0);
  let streak = 0; const d = monday(new Date());
  if ((byWeek[isoD(d)]||0) < meta) d.setDate(d.getDate()-7);
  while ((byWeek[isoD(d)]||0) >= meta) { streak++; d.setDate(d.getDate()-7); }
  return {byDay, byWeek, semana, mes: mesL.length, minMes, streak, meta};
}
function heatmap(byDay, weeks){
  const end = monday(new Date()); const start = new Date(end); start.setDate(start.getDate() - 7*(weeks-1));
  const now = new Date(); let cols = "", months = "", lastM = -1, total = 0;
  for (let w=0; w<weeks; w++) {
    let cells = "";
    const wd = new Date(start); wd.setDate(start.getDate()+w*7);
    const m = wd.getMonth();
    months += `<span>${m!==lastM?MES[m]:""}</span>`; lastM = m;
    for (let k=0; k<7; k++) {
      const d = new Date(start); d.setDate(start.getDate()+w*7+k);
      const key = isoD(d), mins = byDay[key]||0, fut = d > now;
      if (mins) total++;
      const lvl = !mins ? 0 : mins<=45 ? 1 : mins<=90 ? 2 : 3;
      cells += `<i class="${lvl?"h"+lvl:""}${fut?" fut":""}" title="${DIA[d.getDay()]}, ${fmtData(key)}${mins?" · treinou":""}"></i>`;
    }
    cols += `<span class="hcol">${cells}</span>`;
  }
  return `<div class="heat-wrap"><div class="hmonths">${months}</div>
    <div class="heat" role="img" aria-label="Dias de treino nas últimas ${weeks} semanas: ${total}">${cols}</div>
    <div class="muted small" style="margin-top:6px">Cada coluna é uma semana (seg a dom). Mais escuro = treino mais longo.</div></div>`;
}

function initTreinoForm(){
  $("#t-data").value = hoje();
  $("#t-aulas").innerHTML = AULAS.map(a => `<label class="check"><input type="checkbox" value="${a.id}" id="aula-${a.id}"><span>${a.nome}</span></label>`).join("");
  $("#t-foco").addEventListener("change", e => { const i = e.target; if (i.type==="checkbox") i.checked ? S.foco.add(i.value) : S.foco.delete(i.value); });
  $("#t-form").addEventListener("submit", async e => {
    e.preventDefault();
    if (!S.canWrite || !S.db) { toast("Abra este caderno no Claude, conectado, para salvar."); return; }
    const data = $("#t-data").value || hoje();
    const doc = {
      data, minutos: Math.max(0, Number($("#t-min").value)||0), local: $("#t-local").value,
      aulas: [...document.querySelectorAll("#t-aulas input:checked")].map(i=>i.value),
      foco: [...S.foco], notas: $("#t-notas").value.trim(),
    };
    const btn = $("#t-salvar"); btn.disabled = true;
    const editId = S.editTreino;
    try {
      if (editId) {
        const orig = S.treinos.find(t => t._id === editId) || {};
        const {_id, ...resto} = orig;
        await S.db.doc("treinos/"+editId).set({...resto, ...doc, editado: new Date().toISOString()});
        toast("Treino de "+fmtData(data)+" atualizado.");
      } else {
        await S.db.collection("treinos").add({...doc, criado: new Date().toISOString()});
        toast("Treino de "+fmtData(data)+" registrado.");
      }
      resetTreinoForm();
    } catch (err) { onWriteError(err); }
    finally { btn.disabled = false; }
  });
  $("#t-cancelar").addEventListener("click", resetTreinoForm);
}
function resetTreinoForm(){
  S.editTreino = null; S.foco.clear();
  $("#t-data").value = hoje(); $("#t-min").value = 90; $("#t-local").value = "Academia"; $("#t-notas").value = "";
  document.querySelectorAll("#t-aulas input, #t-foco input").forEach(i => { i.checked = false; });

  $("#t-salvar").textContent = "Registrar treino"; $("#t-cancelar").hidden = true;
  renderTreinos(); applyReadOnly();
}
function startEditTreino(id){
  const tr = S.treinos.find(t => t._id === id); if (!tr || !S.canWrite) return;
  S.editTreino = id; S.foco = new Set(tr.foco || []);
  $("#t-data").value = tr.data || hoje();
  $("#t-min").value = tr.minutos ?? 90;
  $("#t-local").value = tr.local || "Academia";
  document.querySelectorAll("#t-aulas input").forEach(i => { i.checked = (tr.aulas || []).includes(i.value); });

  $("#t-form-sub").textContent = fmtData(tr.data);

  renderTreinos(); applyReadOnly();
  $("#t-form").scrollIntoView({block: "start"});
  $("#t-data").focus({preventScroll: true});
}

  const golpe = it.tipo==="soco" || it.tipo==="chute";
  const trad = it.han || it.py || it.pt ? `<div class="trad">${it.han?`<span class="han">${it.han}</span>`:""}${esc([it.py, it.ca, it.pt].filter(Boolean).join(" · "))}</div>` : "";
  const ref = it.ref || it.orig ? `<div class="ref">${it.orig?`<b>${it.orig}ª rotina</b> na ordem original das 10 rotinas de Gu Ruzhang. `:""}${esc(it.ref||"")}</div>` : "";
  const linhas = it.linhas ? `<fieldset><div class="legend">Linhas aprendidas</div><div class="linhas" id="s-linhas">${range(1,it.linhas).map(n =>
      `<label class="check"><input type="checkbox" id="linha-${n}" value="${n}"${(r.linhas||[]).includes(n)?" checked":""}><span>${n}</span></label>`).join("")}</div></fieldset>` : "";
  const nome = golpe ? `<div class="form-row">
      <div class="field"><label for="s-nome">Nome ${it.tipo==="soco"?"do soco":"do chute"}</label><input class="input" id="s-nome" data-k="nome" value="${esc(r.nome||"")}" placeholder="Como é chamado na aula"></div>
      <div class="field"><label for="s-nomeChines">Nome chinês</label><input class="input" id="s-nomeChines" data-k="nomeChines" value="${esc(r.nomeChines||"")}" placeholder="Opcional"></div></div>` : "";
  const campos = CAMPOS.map(c => `<div class="field"><label for="s-${c.k}">${c.t} <span class="hint">${c.h}</span></label>
      <textarea class="input" id="s-${c.k}" data-k="${c.k}" rows="${c.k==="movimentos"?6:3}">${esc(r[c.k]||"")}</textarea></div>`).join("");
  const sheet = $("#sheet");
  sheet.innerHTML = `
    <div class="sheet-head"><div>
        <div class="eyebrow">${it.fase}ª fase · ${esc(TIPOS[it.tipo])}</div>
        <h2 id="s-title">${esc(it.nome)}</h2>${trad}</div>
      <button class="x" type="button" id="s-close" aria-label="Fechar">✕</button></div>
    <div class="sheet-body">
      <fieldset><div class="legend" id="s-st-l">Status</div>
        <div class="seg-ctl" role="radiogroup" aria-labelledby="s-st-l">${Object.keys(STATUS).map(k =>
          `<label data-s="${k}"><input type="radio" name="s-status" id="s-st-${k}" value="${k}"${k===s?" checked":""}>${STATUS[k]}</label>`).join("")}</div></fieldset>
      <div class="form-row">
        <div class="field"><label for="s-inicio">Comecei em</label><input class="input" type="date" id="s-inicio" data-k="inicio" value="${esc(r.inicio||"")}"></div>
        <div class="field"><label for="s-conclusao">Aprendi em</label><input class="input" type="date" id="s-conclusao" data-k="conclusao" value="${esc(r.conclusao||"")}"></div>
      </div>
      ${linhas}${nome}${ref}
      <div class="ask" id="s-ask">
        <h3>Escreva do seu jeito</h3>
        <label for="s-rascunho" class="small">Conte como é o movimento, como contaria a um colega: bases, direção, mãos, pés, o que o professor corrigiu. O Claude organiza nos campos abaixo e não inventa passos.</label>
        <textarea class="input" id="s-rascunho" data-k="rascunho" rows="4">${esc(r.rascunho||"")}</textarea>
        <div class="gtools"><button class="btn" type="button" id="s-claude">Organizar com Claude</button><span class="small muted" id="s-claude-msg"></span></div>
        <div id="s-draft"></div>
      </div>
      <div class="notes"><h3>Ficha</h3>${campos}</div>
    </div>
    <div class="sheet-foot"><span id="s-save">${S.canWrite?(r.atualizado?"Atualizado em "+fmtData(String(r.atualizado).slice(0,10)):"Salva sozinha enquanto você escreve"):"Somente leitura"}</span><span>${it.fase}ª fase</span></div>`;
  $("#scrim").hidden = false; sheet.hidden = false;
  if (!S.sample) $("#s-claude").hidden = true;
  applyReadOnly();
  $("#s-close").focus();
}
function closeSheet(){
  flushDirty();
  S.sheetId = null; $("#sheet").hidden = true; $("#scrim").hidden = true; $("#sheet").innerHTML = "";
}
let dirtyTimer = null;
function flushDirty(){
  clearTimeout(dirtyTimer);
  for (const id of Object.keys(S.dirty)) { const p = S.dirty[id]; delete S.dirty[id]; saveItem(id, p); }
}
function onSheetInput(e){
  const el = e.target, id = S.sheetId; if (!id || !S.canWrite) return;
  if (el.name === "s-status") {
    const v = el.value, r = rec(id), patch = {status: v};
    if (v==="aprendido" && !r.conclusao) { patch.conclusao = hoje(); const c = $("#s-conclusao"); if (c) c.value = patch.conclusao; }
    if (v==="aprendendo" && !r.inicio) { patch.inicio = hoje(); const c = $("#s-inicio"); if (c) c.value = patch.inicio; }
    if (v==="aprendido" && ITENS[id].linhas) { patch.linhas = range(1, ITENS[id].linhas); document.querySelectorAll("#s-linhas input").forEach(i=>{ i.checked = true; }); }
    flushDirty(); saveItem(id, patch); return;
  }
  if (el.closest && el.closest("#s-linhas")) {
    const ls = [...document.querySelectorAll("#s-linhas input:checked")].map(i=>Number(i.value));
    const patch = {linhas: ls};
    const r = rec(id), total = ITENS[id].linhas, cur = r.status || "novo";
    if (ls.length === total && cur !== "aprendido") { patch.status = "aprendido"; if (!r.conclusao) { patch.conclusao = hoje(); const c = $("#s-conclusao"); if (c) c.value = patch.conclusao; } }
    else if (ls.length && ls.length < total && cur !== "aprendendo") { patch.status = "aprendendo"; if (!r.inicio) { patch.inicio = hoje(); const c = $("#s-inicio"); if (c) c.value = patch.inicio; } }
    if (patch.status) { const x = $("#s-st-"+patch.status); if (x) x.checked = true; }
    flushDirty(); saveItem(id, patch); return;
  }
  const k = el.dataset && el.dataset.k; if (!k) return;
  S.dirty[id] = {...(S.dirty[id]||{}), [k]: el.value};
  setSaveState("salvando");
  clearTimeout(dirtyTimer); dirtyTimer = setTimeout(flushDirty, el.type==="date" ? 50 : 900);
}
function refreshSheetFromStore(){
  const id = S.sheetId; if (!id || S.dirty[id]) return;
  const r = rec(id), sheet = $("#sheet");
  sheet.querySelectorAll("[data-k]").forEach(el => {
    if (el === document.activeElement) return;
    const v = r[el.dataset.k] || ""; if (el.value !== v) el.value = v;
  });
  const radio = $("#s-st-"+st(id)); if (radio && !radio.checked) radio.checked = true;
  if (ITENS[id].linhas) sheet.querySelectorAll("#s-linhas input").forEach(i => { i.checked = (r.linhas||[]).includes(Number(i.value)); });
}
function applyReadOnly(){
  const ro = !S.canWrite;
  document.querySelectorAll("#sheet input, #sheet textarea, #t-form input, #t-form select, #t-form textarea, #t-form button, .gtools input, .gtools button[type=submit]").forEach(el => { el.disabled = ro; });
  const ask = $("#s-ask"); if (ask) ask.hidden = ro;
}

/* ---------- Claude organiza as anotações ---------- */
let claudeCtl = null;
async function askClaude(){
  const id = S.sheetId; if (!id || !S.sample) return;
  flushDirty();
  const it = ITENS[id], r = rec(id);
  const raw = ($("#s-rascunho").value || "").trim();
  const msg = $("#s-claude-msg"), btn = $("#s-claude");
  const fase = FASES[it.fase-1];
  const atual = {}; CAMPOS.forEach(c => { if ((r[c.k]||"").trim()) atual[c.k] = r[c.k]; });
  const prompt = `Você ajuda um praticante de Kung Fu Shaolin do Norte (linhagem Sino-Brasileira do Grão-Mestre Chan Kowk Wai, Academia Santista de Kung Fu, Santos) a organizar as anotações do caderno de treino. Escreva em português do Brasil, claro e direto.

Item: ${it.nome}${r.nome?` ("${r.nome}")`:""}
Tipo: ${TIPOS[it.tipo]} · ${it.fase}ª fase (${fase.titulo})
${it.han?`Nome tradicional: ${it.han} ${it.py||""} ${it.pt?"("+it.pt+")":""}`:""}
${it.linhas?`O Tantui da academia tem ${it.linhas} linhas. Linhas já aprendidas: ${(r.linhas||[]).join(", ")||"nenhuma marcada"}.`:""}

Rascunho do praticante:
"""
${raw || "(vazio)"}
"""

Ficha atual (pode estar vazia):
${JSON.stringify(atual, null, 1)}

Tarefa: reorganize o rascunho e a ficha atual em campos. Regras:
- A sequência de movimentos vem SOMENTE do que o praticante escreveu. Não invente passos, direções nem quantidades. Se o rascunho não trouxer a sequência, devolva "movimentos" vazio.
- Você pode completar com conhecimento técnico geral e consolidado (como se forma uma base, que parte do pé golpeia num chute frontal) e usar termos em pinyin entre parênteses quando ajudar.
- Mantenha o que já está na ficha, a menos que o rascunho corrija.
- Coloque em "duvidas" perguntas curtas para o praticante confirmar com o professor quando algo estiver ambíguo ou depender da linhagem.
- Para um soco ou chute com nome e sem rascunho, descreva a execução como é feita em geral e inclua uma dúvida pedindo para confirmar os detalhes na academia.

Responda só com JSON neste formato:
{"resumo":"…","movimentos":["…"],"pontos":["…"],"erros":["…"],"aplicacoes":["…"],"duvidas":["…"]}`;
  btn.disabled = true; msg.textContent = "Pensando…";
  claudeCtl = new AbortController();
  try {
    const out = await S.sample.json(prompt, {signal: claudeCtl.signal, onText: () => { msg.textContent = "Escrevendo…"; }});
    if (S.sheetId !== id) return;
    showDraft(id, out || {});
    msg.textContent = "";
  } catch (e) {
    const c = e && e.code;
    msg.textContent = c==="not_granted" ? "Sem permissão para usar o Claude aqui." :
      c==="rate_limited" ? "Muitos pedidos seguidos. Espere um pouco e tente de novo." :
      c==="cancelled" ? "" : c==="invalid_json" ? "A resposta veio fora do formato. Tente de novo." :
      "Não deu certo agora. Tente de novo em instantes.";
    if (c==="not_granted" || c==="sampling_disabled" || c==="not_declared") btn.hidden = true;
  } finally { btn.disabled = false; }
}
function showDraft(id, out){
  const arr = v => Array.isArray(v) ? v.map(String).filter(Boolean) : (v ? [String(v)] : []);
  const d = {resumo: typeof out.resumo==="string"?out.resumo:"", movimentos:arr(out.movimentos), pontos:arr(out.pontos), erros:arr(out.erros), aplicacoes:arr(out.aplicacoes), duvidas:arr(out.duvidas)};
  const sec = (t, xs, ol) => xs.length ? `<div><h4>${t}</h4>${ol?"<ol>":"<ul>"}${xs.map(x=>`<li>${esc(x)}</li>`).join("")}${ol?"</ol>":"</ul>"}</div>` : "";
  $("#s-draft").innerHTML = `<div class="draft">
      ${d.resumo?`<div><h4>O que é</h4><p style="margin:0">${esc(d.resumo)}</p></div>`:""}
      ${sec("Sequência de movimentos", d.movimentos, true)}${sec("Pontos-chave", d.pontos)}${sec("Erros comuns", d.erros)}${sec("Aplicações", d.aplicacoes)}
      ${sec("Para confirmar com o professor", d.duvidas)}
      <div class="gtools"><button class="btn sm" type="button" id="d-apply">Usar na ficha</button><button class="btn sm quiet" type="button" id="d-discard">Descartar</button></div></div>`;
  $("#d-discard").onclick = () => { $("#s-draft").innerHTML = ""; };
  $("#d-apply").onclick = () => {
    const r = rec(id), patch = {};
    if (d.resumo) patch.resumo = d.resumo;
    if (d.movimentos.length) patch.movimentos = d.movimentos.join("\n");
    if (d.pontos.length) patch.pontos = d.pontos.join("\n");
    if (d.erros.length) patch.erros = d.erros.join("\n");
    if (d.aplicacoes.length) patch.aplicacoes = d.aplicacoes.join("\n");
    if (d.duvidas.length) patch.observacoes = [(r.observacoes||"").trim(), "Confirmar com o professor:\n" + d.duvidas.map(x=>"- "+x).join("\n")].filter(Boolean).join("\n\n");
    flushDirty(); saveItem(id, patch).then(() => {});
    Object.entries(patch).forEach(([k,v]) => { const el = $("#s-"+k); if (el) el.value = v; });
    $("#s-draft").innerHTML = ""; toast("Ficha atualizada.");
  };
}

/* ---------- Exportar ---------- */
function exportMarkdown(){
  const L = [];
  const f = faseAtual();
  L.push("# Caderno Shaolin do Norte", "", `Academia Santista de Kung Fu · exportado em ${fmtData(hoje())}`, "",
    `Fase atual: **${f.n}ª fase · ${f.titulo}** · ${Math.round(faseStats(f).pct*100)}% da fase · ${Math.round(totalPct()*100)}% da grade`, "");
  const bloco = (id) => {
    const it = ITENS[id], r = rec(id), out = [];
    for (const c of CAMPOS) {
      const v = (r[c.k]||"").trim(); if (!v) continue;
      if (c.k === "resumo") out.push(v, "");
      else if (c.k === "movimentos") out.push(`**${c.t}**`, "", ...lines(v).map((x,i)=>`${i+1}. ${x.replace(/^\d+[.)]\s*/,"")}`), "");
      else out.push(`**${c.t}**`, "", ...lines(v).map(x=>`- ${x.replace(/^[-•]\s*/,"")}`), "");
    }
    return out;
  };
  for (const fz of FASES) {
    L.push(`## ${fz.n}ª fase · ${fz.titulo}${fz.han?" "+fz.han:""}`, "");
    for (const it of fz.formas) {
      const r = rec(it.id);
      L.push(`### ${it.nome}${it.han?` · ${it.han}`:""}${it.py?` ${it.py}`:""}${it.pt?` (${it.pt})`:""}`, "");
      const meta = [`Status: ${STATUS[st(it.id)]}`];
      if (it.linhas) meta.push(`linhas: ${(r.linhas||[]).length}/${it.linhas}`);
      if (r.inicio) meta.push(`início: ${fmtData(r.inicio)}`);
      if (r.conclusao) meta.push(`aprendido em: ${fmtData(r.conclusao)}`);
      L.push(`_${meta.join(" · ")}_`, "", ...bloco(it.id));
    }
    if (fz.golpes) for (const tipo of ["soco","chute"]) {
      L.push(`### ${tipo==="soco"?"Socos":"Chutes"} ${fz.golpes[0]}–${fz.golpes[1]}`, "", "| Nº | Nome | Status |", "|---|---|---|");
      for (const i of range(fz.golpes[0], fz.golpes[1])) { const r = rec(tipo+"-"+i); L.push(`| ${i} | ${(r.nome||"").replace(/\|/g,"/")} | ${STATUS[st(tipo+"-"+i)]} |`); }
      L.push("");
      for (const i of range(fz.golpes[0], fz.golpes[1])) {
        const b = bloco(tipo+"-"+i); if (b.length) L.push(`#### ${i}º ${tipo}${rec(tipo+"-"+i).nome?" · "+rec(tipo+"-"+i).nome:""}`, "", ...b);
      }
    }
  }
  const tr = [...S.treinos].sort((a,b)=>String(a.data).localeCompare(String(b.data)));
  if (tr.length) {
    L.push("## Treinos", "", "| Data | Duração | Onde | Aulas e foco | Notas |", "|---|---|---|---|---|");
    for (const t of tr) {
      const tags = [...(t.aulas||[]).map(a=>(AULAS.find(x=>x.id===a)||{nome:a}).nome), ...(t.foco||[]).map(x=>ITENS[x]?ITENS[x].nome:x)].join(", ");
      L.push(`| ${fmtData(t.data)} | ${fmtMin(t.minutos)} | ${t.local||""} | ${tags} | ${String(t.notas||"").replace(/\n/g," ").replace(/\|/g,"/")} |`);
    }
    L.push("");
  }
  return L.join("\n");
}
async function doDownload(filename, data){
  if (!S.downloads) { toast("Exportar só funciona com o caderno aberto no Claude."); return; }
  try { await S.downloads.save({filename, data}); }
  catch (e) { if (e && e.code !== "declined") toast("Não consegui gerar o arquivo agora."); }
}

/* ---------- Roteamento e render ---------- */
const VIEWS = ["painel","sequencia","golpes","treinos","referencia"];
function renderViews(){
  renderPainel(); renderSequencia(); renderGolpes(); renderTreinos();
  applyReadOnly();
}
function showView(){
  const h = (location.hash||"").slice(1);
  S.view = VIEWS.includes(h) ? h : "painel";
  document.querySelectorAll(".view").forEach(v => { v.hidden = v.dataset.view !== S.view; });
  document.querySelectorAll(".tabs a").forEach(a => { if (a.dataset.v === S.view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
}

document.addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if (open) { e.preventDefault(); openSheet(open.dataset.open); return; }
  const go = e.target.closest("[data-goto]");
  if (go) { setTimeout(() => { const t = document.getElementById("tile-"+go.dataset.goto); if (t) t.scrollIntoView({block:"center"}); }, 60); return; }
  const ed = e.target.closest("[data-edit]");
  if (ed) { startEditTreino(ed.dataset.edit); return; }
  const del = e.target.closest("[data-del]");
  if (del) {
    if (del.dataset.armed) { writeDoc("treinos/"+del.dataset.del, null, "delete").then(()=>toast("Treino excluído.")); }
    else { del.dataset.armed = "1"; del.textContent = "Confirmar"; del.classList.add("danger"); setTimeout(() => { if (del.isConnected) { delete del.dataset.armed; del.textContent = "Excluir"; del.classList.remove("danger"); } }, 4000); }
    return;
  }
  if (e.target.id === "s-close" || e.target.id === "scrim") { closeSheet(); return; }
  if (e.target.id === "s-claude") { askClaude(); return; }
  if (e.target.id === "exp-md") { doDownload("caderno-shaolin-do-norte.md", exportMarkdown()); return; }
  if (e.target.id === "exp-json") { doDownload("caderno-shaolin-do-norte.json", JSON.stringify({exportado: new Date().toISOString(), itens: S.itens, treinos: S.treinos, config: S.config}, null, 2)); return; }
});
document.addEventListener("submit", e => {
  const bulk = e.target.closest("[data-bulk]");
  if (bulk) {
    e.preventDefault();
    const tipo = bulk.dataset.bulk, n = Math.min(MAXG, Math.max(0, Number(bulk.querySelector("input").value)||0));
    if (!n) return;
    if (!S.canWrite) return;
    let c = 0;
    for (let i=1; i<=n; i++) {
      const id = tipo+"-"+i; if (st(id) === "aprendido") continue;
      const patch = {status:"aprendido"};
      // Só o último número marcado (o recém-aprendido) e os que estavam em andamento ganham a data de hoje.
      if (!rec(id).conclusao && (i === n || st(id) === "aprendendo")) patch.conclusao = hoje();
      c++; saveItem(id, patch);
    }
    toast(c ? `${tipo==="soco"?"Socos":"Chutes"} de 1 a ${n} marcados como aprendidos.` : "Esses já estavam marcados.");
    return;
  }
  if (e.target.id === "meta-form") {
    e.preventDefault();
    const v = Math.min(14, Math.max(1, Number($("#meta").value)||3));
    S.config = {...S.config, metaSemanal: v}; renderViews();
    writeDoc("config/geral", S.config).then(()=>toast("Meta de "+v+" treinos por semana salva."));
  }
});
document.addEventListener("toggle", e => {
  const d = e.target; if (!d.matches || !d.matches("details.fase")) return;
  const n = Number(d.dataset.fase); d.open ? S.openFases.add(n) : S.openFases.delete(n);
}, true);
$("#sheet").addEventListener("input", e => { if (e.target.type !== "radio" && e.target.type !== "checkbox") onSheetInput(e); });
$("#sheet").addEventListener("change", e => { if (e.target.type === "radio" || e.target.type === "checkbox") onSheetInput(e); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheetId) closeSheet(); });
window.addEventListener("hashchange", showView);
window.addEventListener("pagehide", flushDirty);

/* ---------- Início ---------- */
renderReferencia();
initTreinoForm();
renderViews();
showView();
banner("Carregando seu progresso…");

(async function boot(){
  const C = window.claude;
  const use = n => (C && C.use ? C.use(n).catch(()=>null) : Promise.resolve(null));
  const [db, user, sample, downloads] = await Promise.all([use("db"), use("user"), use("sample"), use("downloads")]);
  S.sample = sample; S.downloads = downloads;
  if (!db) {
    S.dbState = "off"; S.canWrite = false; applyReadOnly();
    banner("Para salvar o progresso, abra este caderno no Claude com sua conta. Aqui você vê só a grade.", "warn");
    return;
  }
  S.db = db;
  if (user && user.can) { try { const w = await user.can("data.write"); if (w === false) { S.canWrite = false; applyReadOnly(); } } catch(_){} }
  let got = {itens:false, treinos:false};
  const timer = setTimeout(() => { if (!got.itens) banner("Ainda não consegui carregar seus dados. A página continua tentando; confira a conexão.", "warn"); }, 10000);
  const done = () => { if (got.itens && got.treinos) { clearTimeout(timer); banner(S.canWrite ? "" : "Você está vendo este caderno sem permissão para editar."); } };
  db.collection("itens").onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); });
    S.itens = m;
    if (!snap.metadata.fromCache) { got.itens = true; done(); }
    renderViews(); refreshSheetFromStore();
  }, err => { clearTimeout(timer); banner("Não consegui ler o progresso salvo ("+(err&&err.code||"erro")+").", "warn"); });
  db.collection("treinos").onSnapshot(snap => {
    S.treinos = snap.docs.map(d => ({...d.data(), _id: d.id}));
    if (!snap.metadata.fromCache) { got.treinos = true; done(); }
    renderViews();
  }, () => { got.treinos = true; done(); });
  db.doc("config/geral").onSnapshot(snap => {
    if (snap.exists) { S.config = {...S.config, ...snap.data()}; renderViews(); }
  }, () => {});
})();
</script>
